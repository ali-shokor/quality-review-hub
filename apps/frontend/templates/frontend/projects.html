{% extends 'frontend/base.html' %}
{% load static %}

{% block title %}Projects{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h1 class="page-title">Projects</h1>
    <p class="page-subtitle mb-0">
      Manage evaluation projects
    </p>
  </div>
</div>

<div class="card p-4 mb-4">

  <h4 class="mb-3">Create Project</h4>

  <form id="projectForm">

    <div class="mb-3">
      <label class="form-label">Project Name</label>

      <input
        type="text"
        id="projectName"
        class="form-control"
        required
      >
    </div>

    <div class="mb-3">
      <label class="form-label">Description</label>

      <textarea
        id="projectDescription"
        class="form-control"
        rows="4"
      ></textarea>
    </div>

    <button class="btn btn-warning fw-semibold">
      Create Project
    </button>

  </form>
</div>

<div class="card p-4">

  <h4 class="mb-3">All Projects</h4>

  <div id="projectsList"></div>

</div>

{% endblock %}

{% block scripts %}
<script src="{% static 'frontend/js/api.js' %}"></script>
<script src="{% static 'frontend/js/projects.js' %}"></script>
{% endblock %}
