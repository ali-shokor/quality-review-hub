{% extends 'frontend/base.html' %}
{% load static %}

{% block title %}Projects{% endblock %}

{% block content %}

<div class="mb-4 slide-in-down">
  <h1 class="page-title">📁 Projects</h1>
  <p class="page-subtitle mb-0">
    Manage and organize evaluation projects
  </p>
</div>

<div class="card p-4 p-md-5 mb-4 slide-in-up">

  <h4 class="mb-4">➕ Create New Project</h4>

  <form id="projectForm">

    <div class="mb-3">
      <label class="form-label">Project Name</label>

      <input
        type="text"
        id="projectName"
        class="form-control form-control-lg"
        placeholder="Enter project name"
        required
      >
    </div>

    <div class="mb-3">
      <label class="form-label">Description</label>

      <textarea
        id="projectDescription"
        class="form-control"
        rows="4"
        placeholder="Describe your project..."
      ></textarea>
    </div>

    <button class="btn btn-warning fw-semibold" type="submit">
      Create Project
    </button>

  </form>
</div>

<div class="card p-4 p-md-5 slide-in-up" style="animation-delay: 0.1s;">

  <h4 class="mb-4">📚 All Projects</h4>

  <div id="projectsList" class="list-group list-group-flush"></div>

</div>

{% endblock %}

{% block scripts %}
<script src="{% static 'frontend/js/api.js' %}"></script>
<script src="{% static 'frontend/js/projects.js' %}"></script>
{% endblock %}
