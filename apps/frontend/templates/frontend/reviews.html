{% extends 'frontend/base.html' %}
{% load static %}

{% block title %}Reviews{% endblock %}

{% block content %}

<div class="mb-4 slide-in-down">
  <h1 class="page-title">✅ Reviews</h1>

  <p class="page-subtitle mb-0">
    Evaluate and provide feedback on submissions
  </p>
</div>

<div class="card p-4 p-md-5 mb-4 slide-in-up">

  <h4 class="mb-4">➕ Create New Review</h4>

  <form id="reviewForm">

    <div class="mb-3">
      <label class="form-label">Submission</label>
      <select id="submissionSelect" class="form-select form-select-lg" required>
        <option value="">— Select a Submission —</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Evaluation Criterion</label>
      <select id="criterionSelect" class="form-select form-select-lg" required>
        <option value="">— Select a Criterion —</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Score</label>
      <input
        type="number"
        step="0.1"
        id="score"
        class="form-control form-control-lg"
        placeholder="Enter score (e.g., 8.5)"
        required
      >
    </div>

    <div class="mb-3">
      <label class="form-label">Feedback</label>
      <textarea
        id="feedback"
        class="form-control"
        rows="4"
        placeholder="Provide detailed feedback..."
      ></textarea>
    </div>

    <button class="btn btn-primary fw-semibold" type="submit">
      Add Review
    </button>

  </form>

  <hr class="my-4" style="border-color: rgba(255, 255, 255, 0.1);">

  <div id="reviewsContainer"></div>
</div>

<div class="card p-4 p-md-5 slide-in-up" style="animation-delay: 0.1s;">

  <h4 class="mb-4">📋 All Reviews</h4>

  <div id="reviewsList" class="list-group list-group-flush"></div>

</div>

{% endblock %}

{% block scripts %}
<script src="{% static 'frontend/js/api.js' %}"></script>
<script src="{% static 'frontend/js/reviews.js' %}"></script>
{% endblock %}
