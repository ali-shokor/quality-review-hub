{% extends 'frontend/base.html' %}
{% load static %}

{% block title %}Reviews{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h1 class="page-title">Reviews</h1>

    <p class="page-subtitle mb-0">
      Evaluate submissions
    </p>
  </div>
</div>

<div class="card p-4 mb-4">

  <h4 class="mb-3">Create Review</h4>

  <form id="reviewForm">

  <select id="submissionSelect" class="form-select mb-3">
  </select>

  <select id="criterionSelect" class="form-select mb-3">
  </select>

  <input
    type="number"
    step="0.1"
    id="score"
    class="form-control mb-3"
    placeholder="Score"
  >

  <textarea
    id="feedback"
    class="form-control mb-3"
    placeholder="Feedback"
  ></textarea>

  <button class="btn btn-primary">
    Add Review
  </button>

</form>

<hr class="my-4">

<div id="reviewsContainer"></div>
</div>

<div class="card p-4">

  <h4 class="mb-3">All Reviews</h4>

  <div id="reviewsList"></div>

</div>

{% endblock %}

{% block scripts %}
<script src="{% static 'frontend/js/api.js' %}"></script>
<script src="{% static 'frontend/js/reviews.js' %}"></script>
{% endblock %}
