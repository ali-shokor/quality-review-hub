{% extends 'frontend/base.html' %}
{% load static %}

{% block title %}Submissions{% endblock %}

{% block content %}

<div class="mb-4 slide-in-down">
  <h1 class="page-title">📝 Submissions</h1>
  <p class="page-subtitle mb-0">
    Create and manage project submissions
  </p>
</div>

<div class="card p-4 p-md-5 mb-4 slide-in-up">

  <h4 class="mb-4">➕ Create New Submission</h4>

  <form id="submissionForm">

    <div class="mb-3">
      <label class="form-label">Project</label>

      <select id="projectSelect" class="form-select form-select-lg" required>
        <option value="">— Select a Project —</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Title</label>

      <input
        type="text"
        id="submissionTitle"
        class="form-control form-control-lg"
        placeholder="Enter submission title"
        required
      >
    </div>

    <div class="mb-3">
      <label class="form-label">Content</label>

      <textarea
        id="submissionContent"
        class="form-control"
        rows="5"
        placeholder="Write your submission content here..."
        required
      ></textarea>
    </div>

    <button class="btn btn-warning fw-semibold" type="submit">
      Create Submission
    </button>

  </form>
</div>

<div class="card p-4 p-md-5 slide-in-up" style="animation-delay: 0.1s;">

  <h4 class="mb-4">📚 All Submissions</h4>

  <div id="submissionsList" class="list-group list-group-flush"></div>

</div>

{% endblock %}

{% block scripts %}
<script src="{% static 'frontend/js/api.js' %}"></script>
<script src="{% static 'frontend/js/submissions.js' %}"></script>
{% endblock %}
