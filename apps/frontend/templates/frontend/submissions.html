{% extends 'frontend/base.html' %}
{% load static %}

{% block title %}Submissions{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h1 class="page-title">Submissions</h1>
    <p class="page-subtitle mb-0">
      Manage project submissions
    </p>
  </div>
</div>

<div class="card p-4 mb-4">

  <h4 class="mb-3">Create Submission</h4>

  <form id="submissionForm">

    <div class="mb-3">
      <label class="form-label">Project</label>

      <select id="projectSelect" class="form-select" required>
        <option value="">Choose Project</option>
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Title</label>

      <input
        type="text"
        id="submissionTitle"
        class="form-control"
        required
      >
    </div>

    <div class="mb-3">
      <label class="form-label">Content</label>

      <textarea
        id="submissionContent"
        class="form-control"
        rows="5"
        required
      ></textarea>
    </div>

    <button class="btn btn-warning fw-semibold">
      Create Submission
    </button>

  </form>
</div>

<div class="card p-4">

  <h4 class="mb-3">All Submissions</h4>

  <div id="submissionsList"></div>

</div>

{% endblock %}

{% block scripts %}
<script src="{% static 'frontend/js/api.js' %}"></script>
<script src="{% static 'frontend/js/submissions.js' %}"></script>
{% endblock %}
