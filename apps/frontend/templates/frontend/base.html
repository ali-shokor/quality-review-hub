{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% block title %}Quality Review Hub{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'frontend/css/style.css' %}">
</head>

<body class="app-bg">

  <nav class="navbar navbar-expand-lg navbar-dark glass-nav px-3">
    <div class="container-fluid">

      <a class="navbar-brand fw-bold" href="/dashboard/">
        Quality Review Hub
      </a>

      <div class="ms-auto d-flex gap-2">

        <a class="btn btn-outline-light btn-sm" href="/dashboard/">
          Dashboard
        </a>

        <a class="btn btn-outline-light btn-sm" href="/projects/">
          Projects
        </a>

        <a class="btn btn-outline-light btn-sm" href="/submissions/">
          Submissions
        </a>

        <a class="btn btn-outline-light btn-sm" href="/reviews/">
          Reviews
        </a>

        <button id="logoutBtn" class="btn btn-warning btn-sm fw-semibold">
          Logout
        </button>

      </div>
    </div>
  </nav>

  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="{% static 'frontend/js/auth.js' %}"></script>

  {% block scripts %}{% endblock %}

</body>
</html>
